<meta name="description" content="跟着雨滴拍出节奏，把声势和鼓圈串成一场音乐接龙。">
<style>

.side{display:flex;flex-direction:column;gap:10px}.card{padding:12px 13px}.pose-card{position:relative;background:linear-gradient(125deg,#fffef8,color-mix(in srgb,var(--accent) 24%,#fffdf3));overflow:hidden;padding-bottom:10px}.pose-box{display:grid;grid-template-columns:minmax(0,1fr) 54%;align-items:center;min-height:132px;gap:4px}.pose-copy{align-self:center;min-width:0}.pattern{display:flex;flex-direction:column;align-items:flex-start;gap:5px;font-size:clamp(.87rem,1.4vw,1.16rem);line-height:1.15;font-weight:850;color:#1a5d6b;margin:4px 0;white-space:nowrap}.pattern .note svg{height:31px}.motion{margin:6px 0 0;font-size:.9rem;font-weight:850;color:#325468}.pose-caption{margin:3px 0 0;font-size:.79rem;line-height:1.3;color:#476274}.portrait{height:132px;width:100%;position:relative;overflow:hidden;border-radius:50% 48% 35% 42%;background:#fff9eeb8;isolation:isolate}.portrait img{display:block;position:absolute;width:133%;max-width:none;left:50%;top:46%;translate:-50% -50%;mix-blend-mode:multiply}.portrait img[data-kind="heavy"]{width:108%;top:44%}.portrait img[data-kind="light"]{width:123%;top:51%}.portrait img[data-kind="medium"]{width:133%;top:52%}
.staff{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.beat{min-width:31px;min-height:26px;display:grid;place-items:center;border-radius:7px;background:#fffefa;border:1px solid #d6e6e6;color:#28566a;padding:2px 4px}.beat .note svg{height:19px}.beat.current{outline:2px solid #2d7c8d;background:#e4f4f0}
.basket{display:grid;grid-template-columns:67px minmax(0,1fr);gap:10px;align-items:center}.jar{position:relative;height:57px;width:56px;border:2px solid #5ba3b5;border-radius:10px 10px 17px 17px;background:#e5f8ff;isolation:isolate;overflow:hidden}.jar:before{content:"";position:absolute;inset:3px 7px auto;height:6px;border-top:2px solid #fff;border-radius:50%;z-index:1}.jar-water{position:absolute;bottom:0;left:0;right:0;height:var(--water,0%);background:linear-gradient(#9edbec,#5fbfdb);border-radius:6px 9px 0 0;transition:height .2s ease}.jar-face{position:absolute;inset:0;display:grid;place-items:center;z-index:1}.jar-face:before,.jar-face:after{content:"";width:4px;height:5px;border-radius:100%;background:#24546c;position:absolute;top:43%;left:16px}.jar-face:after{left:auto;right:16px}.jar-face i{position:absolute;width:10px;height:6px;border-bottom:2px solid #24546c;border-radius:50%;top:48%}.score-row{display:flex;justify-content:space-between;align-items:center;gap:4px}.score{font-size:1.35rem;font-weight:950;color:#227789;white-space:nowrap}.raingauge{display:flex;gap:5px;min-height:20px;margin:8px 0 0;flex-wrap:wrap}.raingauge span{width:8px;height:8px;border:1px solid #7bb0bf;border-radius:70% 10% 70% 70%;rotate:-45deg;background:#e9f4f7}.raingauge span.filled{background:#4cbcd9;border-color:#207786;box-shadow:0 0 6px #69b8d9}.hint,.settings p{margin:5px 0 0;color:var(--muted);font-size:.83rem;line-height:1.43}.meter{height:7px;margin:7px 0 0;background:#ebf3f0;border-radius:30px;overflow:hidden}.meter div{height:100%;width:0;background:#50aa9e;border-radius:inherit}.switches{display:flex;gap:6px;margin-top:8px}.switches button{flex:1;padding:6px 4px;font-size:.83rem}.switches button[aria-pressed="true"]{border-color:#78a9a5;background:#d9eeea}.settings label{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.82rem;white-space:nowrap}.settings input{width:100%;min-width:20px;accent-color:#3e9596}.stage-note{margin:12px 0 0;text-align:center;color:#365b66;font-size:.87rem}
@media(max-width:830px){.shell{width:calc(100% - 28px)}.workspace{grid-template-columns:minmax(0,1fr) 260px}.level{padding:5px 7px;gap:5px}.level-icon{min-width:32px;height:32px}.instrument{flex-direction:column}.sky-note.left{left:5%}}@media(max-width:650px){.shell{width:calc(100% - 20px);padding-top:10px}.workspace{grid-template-columns:1fr}.levels{grid-template-columns:1fr 1fr;gap:7px}.hero{margin-bottom:5px;min-height:95px}.hero .sub{font-size:.84rem}.sky-ornament{opacity:.4}.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pose-card{grid-column:1/-1}.pose-box{grid-template-columns:1fr 1fr}.portrait{max-width:166px}.pattern{font-size:1.15rem}.controls,.controls:has(#next){grid-template-columns:1fr 1fr}.tap{grid-column:1/-1}.controls:has(#next) .tap{grid-column:2}.track{height:310px}.basket{grid-template-columns:1fr;gap:4px}.jar{width:47px;height:40px}.jar-face:before{left:13px}.jar-face:after{right:13px}.switches{flex-direction:column}.turn{font-size:.87rem}}@media(prefers-reduced-motion:reduce){.jar-water{transition:none}}
 .sample-credit{font-size:.78rem;color:var(--muted);margin:7px 0 0}.sample-credit summary{cursor:pointer;width:fit-content}.sample-credit p{margin:5px 0 0;line-height:1.5}.sample-credit a{color:#216c76}

<body>
<main class="shell">
<header class="mast"><div class="brand"><span class="logo" aria-hidden="true">♫</span> 雨滴音乐教室</div><button class="utility" id="fullscreen">全屏投影</button></header>
<section class="hero"><div><p>听！雨滴在唱歌</p><h1>雨的节奏接龙</h1><p class="sub">雨滴抵达亮线时击打，和同伴一起把雨声接下去。</p></div><div class="sky-ornament" aria-hidden="true"><span class="cloud"></span><span class="cloud small"></span><span class="sky-note">♫</span><span class="sky-note left">♪</span><span class="sky-rain">′ ′ ′</span></div></section>
<nav class="levels" aria-label="选择关卡">
<button class="level" data-level="light" style="--tone:var(--mint)"><span class="level-icon" aria-hidden="true">💧</span><span><b>小雨</b><small>ta · 每拍 1 下</small></span></button>
<button class="level" data-level="medium" style="--tone:var(--gold)"><span class="level-icon" aria-hidden="true">🌦️</span><span><b>中雨</b><small>ti-ti · 每拍 2 下</small></span></button>
<button class="level" data-level="heavy" style="--tone:var(--pink)"><span class="level-icon" aria-hidden="true">🌧️</span><span><b>大雨</b><small>di-li-di-li · 每拍 4 下</small></span></button>
<button class="level" data-level="relay" style="--tone:var(--violet)"><span class="level-icon" aria-hidden="true">🥁</span><span><b>鼓圈接龙</b><small>三组轮流接拍</small></span></button>
</nav>
<div class="workspace">
<section class="game" aria-label="节奏轨道">
<div class="game-head"><div class="turn"><span class="pill" id="tag"></span><span class="team" id="team"></span></div><select id="tempo" aria-label="练习速度"><option value="60">慢速 · 60 BPM</option><option value="72" selected>课堂 · 72 BPM</option><option value="84">挑战 · 84 BPM</option></select></div>
<div class="track" id="track"><div class="meadow" aria-hidden="true"></div><span class="track-spark" aria-hidden="true">✦</span><span class="track-spark right" aria-hidden="true">✧</span><div id="drops" aria-hidden="true"></div><div class="line"><span>击打线</span></div><div class="focus-ring" id="ring" aria-hidden="true"></div><div class="overlay" id="overlay"><span class="mark" id="mark" aria-hidden="true"></span><strong id="message"></strong><p id="prompt"></p></div><div class="feedback" id="feedback"></div></div>
<div class="controls"><button class="primary" id="start">开始挑战</button><button class="ghost" id="demo">听节奏</button><button class="ghost tap" id="tap" aria-label="击打，也可以按空格">击打 / 空格</button></div>
<section class="sounds" aria-label="乐器试听"><div class="sound-head"><h2>乐器试听</h2><p>点乐器听一次实录，再按「听节奏」听整段。</p></div><div class="sound-list">
<button class="instrument" data-instrument="cue" aria-pressed="true"><i aria-hidden="true">♫</i>提示音</button>
<button class="instrument" data-instrument="wood" aria-pressed="false"><i aria-hidden="true">🪵</i>双响筒</button>
<button class="instrument" data-instrument="triangle" aria-pressed="false"><i aria-hidden="true">△</i>三角铁</button>
<button class="instrument" data-instrument="drum" aria-pressed="false"><i aria-hidden="true">🥁</i>手鼓</button>
<button class="instrument" data-instrument="shaker" aria-pressed="false"><i aria-hidden="true">🪇</i>沙锤</button>
</div><details class="sample-credit"><summary>乐器录音来源</summary><p>Joseph Sardin / BigSoundBank（CC0）。双响筒采用木制 Agogô 的<a href="https://bigsoundbank.com/agogo-4-s2260.html" target="_blank" rel="noopener noreferrer">低音</a>与<a href="https://bigsoundbank.com/agogo-3-s2259.html" target="_blank" rel="noopener noreferrer">高音</a>，另有<a href="https://bigsoundbank.com/triangle-1-s1687.html" target="_blank" rel="noopener noreferrer">三角铁</a>、<a href="https://bigsoundbank.com/djembe-hand-flat-in-the-center-s0560.html" target="_blank" rel="noopener noreferrer">非洲手鼓</a>与<a href="https://bigsoundbank.com/maraca-1-s2527.html" target="_blank" rel="noopener noreferrer">沙锤</a>录音。</p></details></section>

<script>

  heavy: {name:'大雨', count:4, symbol:'♬', syllables:'di-li-di-li', motion:'拍大腿', note:'四个十六分音符', color:'var(--pink)', pitch:392},
};
const get = id => document.getElementById(id);

let stageKey;
let pulse = null;

function notation(count, grouped = false) {
  const heads = grouped ? count : 1;
  const spacing = 10;
  const flags = count === 4 ? 2 : count === 2 ? 1 : 0;
  const notes = Array.from({length:heads},(_, index) => {
    const x = 5+spacing*index;
    return '<ellipse cx="'+x+'" cy="22" rx="4.6" ry="3.2" transform="rotate(-22 '+x+' 22)"/>' +
      '<path d="M'+(x+4)+' 21V4" fill="none" stroke="currentColor" stroke-width="1.8"/>';
  }).join('');
  const attachment = Array.from({length:flags},(_, index) => {
    const y = 4+index*4.6;
    if (heads>1) return '<path d="M9 '+y+'H'+(9+(heads-1)*spacing)+'" stroke="currentColor" stroke-width="2.6"/>';
    return '<path d="M9 '+y+'c1 2.8 6.5 3.2 7.3 6.7.35 1.3-.05 2.8-.7 3.45.15-2.9-2.3-4.35-6.6-5.5z"/>';
  }).join('');
  const width = heads>1 ? 13+(heads-1)*spacing : flags ? 19 : 12;
  return '<span class="note" aria-hidden="true"><svg viewBox="0 0 '+width+' 26" fill="currentColor" focusable="false">'+notes+attachment+'</svg></span>';
}

function flashPose() {
  pulse?.cancel();
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
  pulse = get('portrait').animate?.(
    [{transform:'scale(1)'},{transform:'scale(1.035)'},{transform:'scale(1)'}],
    {duration:155,easing:'ease-out'}
  );
}

function beatChart() {
  if (level !== 'relay') return [0,1,2,3].map(slot => ({kind:level, slot, group:0}));
  return ['light','medium','heavy'].flatMap((kind, group) =>
    [0,1].map(beat => ({kind, group:group+1, slot:group*4+beat}))
  );
}
function styleStage(kind, group) {
  const key = level + ':' + kind + ':' + group;
  if (key === stageKey) return;
  stageKey = key;
  const p = rain[kind];
  portraits.forEach(img => img.hidden = img.dataset.kind !== kind);
  document.documentElement.style.setProperty('--accent',p.color);
  get('tag').textContent = level === 'relay' ? '鼓圈接龙' : p.name + '挑战';
  get('team').textContent = group ? '第 ' + group + ' 组 · ' + p.name : '全班练习';
  get('pattern').innerHTML = notation(p.count,true) + '<span>' + p.syllables + '</span>';
  get('motion').textContent = p.motion + ' · ' + p.count + ' 下/拍';
  get('poseCaption').textContent = p.note + (group ? ' · 鼓圈中用乐器' : '');
}
function renderChart(index) {
  const chart = beatChart();
  get('staff').replaceChildren(...chart.map(({kind,slot}, i) => {
    const cell = document.createElement('span');
    cell.className = 'beat' + (i === index ? ' current' : '');
    cell.innerHTML = notation(rain[kind].count,true);
    cell.setAttribute('aria-label','第' + (slot+1) + '拍，' + rain[kind].note);
    return cell;
  }));
}
function overlay(title, text, icon='') {
  overlayIcon = icon;
  get('overlay').hidden = false;
  get('mark').innerHTML = typeof icon === 'number' ? notation(icon,true) : icon;
  get('mark').hidden = !icon;
  get('message').textContent = title;
  get('prompt').textContent = text;
  get('prompt').hidden = !text;
}
function updateScore() {
  const total = beatChart().reduce((sum, beat) => sum + rain[beat.kind].count,0);
  const gauge = get('raingauge');
  if (gauge.childElementCount !== total) {
    gauge.replaceChildren(...Array.from({length:total}, () => document.createElement('span')));
  }
  for (let i=0; i<total; i++) gauge.children[i].classList.toggle('filled', i<hitCount);
  get('score').textContent = hitCount + ' / ' + total;
  const percent = (100*hitCount/total) + '%';
  get('fill').style.width = percent;
  get('jar').style.setProperty('--water',percent);
  get('progress').setAttribute('aria-valuemax',total);
  get('progress').setAttribute('aria-valuenow',hitCount);
}
function showLevel(next) {
  cancelAnimationFrame(frame);
  stopDemo();
  priorOverlay = null;
  level = next;
  phase = 'ready';
  notes = [];
  hitCount = extras = 0;
  get('drops').replaceChildren();
  get('ring').classList.remove('flash');
  get('feedback').textContent = '';
  get('start').textContent = '开始挑战';
  get('tempo').disabled = false;
  get('demo').disabled = false;
  instrumentButtons.forEach(button => button.disabled = false);
  levelButtons.forEach(button => button.setAttribute('aria-pressed', button.dataset.level === level));

  styleStage(kind,group);
  renderChart(-1);
  updateScore();
  get('summary').textContent = '卡准一个落点，收集一颗雨滴。';
  overlay(level === 'relay' ? '准备接龙！' : rain[kind].name + '来了！',
    level === 'relay' ? '小雨、中雨、大雨，三组各演奏一小节。' : '和老师一起念“' + rain[kind].syllables + '”，' + rain[kind].motion + '。',rain[kind].count);
  get('next')?.remove();
}
function audio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});

}

  priorOverlay = null;
}
function stopDemo() {
  clearTimeout(demoTimer);
  cancelAnimationFrame(demoFrame);
  for (const tone of tones) {
    try { tone.stop(); } catch {}

  tones.clear();
  get('demo').textContent = '听节奏';
}
const instrumentButtons = [...document.querySelectorAll('[data-instrument]')];
let instrument = 'cue';
const recordedBuffers = new Map();
let recordedSamples;

function recordedBuffer(name) {
  if (recordedBuffers.has(name)) return recordedBuffers.get(name);
  recordedSamples ??= JSON.parse(get('recordedSamples').textContent);
  const {rate,clips} = recordedSamples;
  const bytes = Uint8Array.from(atob(clips[name]), byte => byte.charCodeAt(0));
  const pcm = new DataView(bytes.buffer);
  const buffer = audio().createBuffer(1,bytes.length/2,rate);
  const samples = buffer.getChannelData(0);
  for (let i=0; i<samples.length; i++) samples[i]=pcm.getInt16(i*2,true)/32768;
  recordedBuffers.set(name,buffer);
  return buffer;
}
function outputVoice(source, gain) {
  source.connect(gain).connect(audio().destination);
  tones.add(source);
  source.onended = () => {
    tones.delete(source);
    source.disconnect();
    gain.disconnect();
  };
}
function playInstrument(at, kind, subdivision=0, position=0) {
  const context = audio();
  const gain = context.createGain();
  if (instrument === 'cue') {
    const source = context.createOscillator();
    source.type = 'sine';
    source.frequency.setValueAtTime(rain[kind].pitch * 2**([0,2,4,5][subdivision]/12),at);
    gain.gain.setValueAtTime(.12,at);
    gain.gain.exponentialRampToValueAtTime(.0004,at+.1);
    outputVoice(source,gain);
    source.start(at);
    source.stop(at+.105);
    return at+.105;
  }
  const name = instrument === 'wood' ? (position%2 ? 'woodHigh' : 'woodLow') : instrument;
  const source = context.createBufferSource();
  source.buffer = recordedBuffer(name);
  gain.gain.value = instrument === 'triangle' ? .66 : .87;
  outputVoice(source,gain);
  source.start(at);
  return at+source.buffer.duration;
}
function selectInstrument(button) {
  if (phase === 'playing') return;
  if (priorOverlay) finishDemo();
  else stopDemo();
  instrument = button.dataset.instrument;
  instrumentButtons.forEach(item => item.setAttribute('aria-pressed', item === button));
  const context = audio();
  const at = context.currentTime+.04;
  const kind = beatChart()[0].kind;
  playInstrument(at,kind);
  if (instrument === 'wood') playInstrument(at+.32,kind,0,1);
}

function demonstrate() {
  if (get('demo').textContent === '停止试听') {
    finishDemo();
    return;
  }
  if (phase === 'playing') return;
  const context = audio();
  const beatTime = 60 / Number(get('tempo').value);
  const start = context.currentTime + .12;
  const chart = beatChart();
  stopDemo();
  let position = 0;
  let audioEnd = start;
  for (const beat of chart) {
    const pattern = rain[beat.kind];
    for (let i=0; i<pattern.count; i++) {
      const at = start + (beat.slot+i/pattern.count)*beatTime;
      audioEnd = Math.max(audioEnd,playInstrument(at,beat.kind,i,position++));
    }
  }
  get('demo').textContent = '停止试听';
  priorOverlay = [get('message').textContent,get('prompt').textContent,overlayIcon];
  overlay('先听一遍', '听一听每一拍里有几下。','♫');
  let previous = -1;
  function followDemo() {
    const slot = Math.floor((context.currentTime-start)/beatTime);
    const index = chart.findIndex(beat => beat.slot===slot);
    if (index!==previous) {
      if (index>=0) styleStage(chart[index].kind,chart[index].group);
      renderChart(index);
      previous = index;
    }
    demoFrame = requestAnimationFrame(followDemo);
  }
  demoFrame = requestAnimationFrame(followDemo);
  const visualEnd = start+(chart.at(-1).slot+1)*beatTime;
  demoTimer = setTimeout(finishDemo, (Math.max(visualEnd,audioEnd)-context.currentTime)*1000+80);
}
function startRound() {
  showLevel(level);
  duration = 60000 / Number(get('tempo').value);
  const chart = beatChart();
  notes = chart.flatMap((beat,index) => {
    const p = rain[beat.kind];
    return Array.from({length:p.count}, (_, subdivision) => {
      const node = document.createElement('span');
      node.className = 'fall' + (beat.slot%2===0 && subdivision===0 ? ' downbeat' : '');
      node.style.setProperty('--note',p.color);
      node.innerHTML = notation(p.count);
      node.dataset.kind = beat.kind;
      node.dataset.subdivision = subdivision;
      node.hidden = true;
      get('drops').append(node);
      return {node, at:(beat.slot+subdivision/p.count)*duration,
        window:Math.min(145,.42*duration/p.count), index, state:'waiting'};
    });
  });
  phase = 'playing';
  started = performance.now() + 3*duration;
  lastGroup = null;
  lastHit = -Infinity;
  get('start').textContent = '停止';
  get('demo').disabled = true;
  instrumentButtons.forEach(button => button.disabled = true);
  get('tempo').disabled = true;
  frame = requestAnimationFrame(tick);
}
function tick(now) {
  const time = now-started;
  const chart = beatChart();
  const slot = Math.floor(time/duration);
  let index = chart.findIndex(beat => beat.slot === slot);
  if (time<0) {
    overlay(String(Math.ceil(-time/duration)), '准备，看到雨滴过线时再击打。');
    index = 0;
  } else if (index < 0 && slot <= chart.at(-1).slot) {
    const upcoming = chart.find(beat => beat.slot > slot);
    styleStage(upcoming.kind,upcoming.group);
    overlay('换到第 ' + upcoming.group + ' 组', '等下一颗雨滴到线再开始。');
  } else {
    get('overlay').hidden = true;
    if (index >= 0) styleStage(chart[index].kind,chart[index].group);
  }
  if (index !== lastGroup) {
    renderChart(index);
    lastGroup = index;
  }
  let missed = false;
  for (const note of notes) {
    if (note.state !== 'waiting') continue;
    const delta = note.at - time;
    if (delta < -note.window) {
      note.state = 'miss';
      note.node.hidden = true;
      missed = true;
      continue;
    }
    note.node.hidden = delta > lead;
    if (!note.node.hidden) note.node.style.top = (hitLine - delta/lead*(hitLine-2)) + '%';
  }
  if (missed && now-lastHit>225) get('feedback').textContent = '下一颗雨滴继续';
  get('ring').classList.toggle('flash',now-lastHit<105);
  if (time > (chart.at(-1).slot+1)*duration+100) endRound();
  else frame = requestAnimationFrame(tick);
}
function strike(timestamp = performance.now()) {
  if (phase !== 'playing') return;
  const elapsed = timestamp-started;
  if (elapsed < -160) return;
  let closest;
  for (const note of notes) {
    const offset = Math.abs(note.at-elapsed);
    if (note.state === 'waiting' && offset <= note.window &&
      (!closest || offset < Math.abs(closest.at-elapsed))) closest = note;
  }
  if (!closest) {
    extras++;
    get('feedback').textContent = '没卡准，等雨滴到亮线';
    return;
  }
  closest.state = 'hit';
  closest.node.hidden = true;
  lastHit = performance.now();
  flashPose();
  hitCount++;
  get('feedback').textContent = '收集到一颗雨滴！';
  updateScore();
}
function endRound() {
  phase = 'result';
  get('ring').classList.remove('flash');
  get('feedback').textContent = '';
  get('start').textContent = '再试一次';
  get('tempo').disabled = false;
  get('demo').disabled = false;
  instrumentButtons.forEach(button => button.disabled = false);
  const missed = notes.length-hitCount;
  let text = '收集 ' + hitCount + ' / ' + notes.length + ' 颗 · 漏打 ' + missed + ' · 多打 ' + extras;
  if (level === 'relay') {
    text += '。各组收集 ' + [0,2,4].map((start,i) => {
      const hits = notes.filter(note => note.index>=start && note.index<start+2 && note.state==='hit').length;
      return hits + '/' + [2,4,8][i];
    }).join('、') + ' 颗。';
  } else if (extras > missed) text += '。先听一遍，留意每拍要打几下。';
  else if (missed) text += '。可以调慢速度再试。';
  get('summary').textContent = text;
  overlay(level === 'relay' ? '接龙完成！' : '本轮结束', text, '✦');
  const nextLevel = order[order.indexOf(level)+1];
  if (nextLevel) {
    const button = document.createElement('button');
    button.id = 'next';
    button.className = 'ghost';
    button.textContent = '下一关 · ' + (rain[nextLevel]?.name ?? '鼓圈接龙');
    button.addEventListener('click',() => showLevel(nextLevel));
    get('start').after(button);
  }
}
function stopMic() {
  input.request++;
  cancelAnimationFrame(input.frame);
  input.source?.disconnect();
  input.stream?.getTracks().forEach(track => track.stop());
  input.source = input.stream = input.analyser = input.buffer = null;
  input.mode = 'keys';
  get('tap').disabled = false;
  get('micMeter').hidden = true;
  get('sensitivityRow').hidden = true;
  get('mic').setAttribute('aria-pressed','false');
  get('keyboard').setAttribute('aria-pressed','true');
  get('inputStatus').textContent = '按空格或点击「击打」。';
}
async function enableMic() {
  if (input.mode === 'mic') {stopMic();return;}
  if (input.mode === 'pending') return;
  if (!navigator.mediaDevices?.getUserMedia) {
    get('inputStatus').textContent = '请在支持麦克风的浏览器窗口打开，或使用键盘 / 触屏。';
    return;
  }
  const request = ++input.request;
  input.mode = 'pending';
  get('inputStatus').textContent = '请允许浏览器使用麦克风。';
  try {
    const context = audio();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}
    });
    if (request !== input.request) {stream.getTracks().forEach(track => track.stop());return;}
    input.stream = stream;
    await context.resume();
    if (request !== input.request) return;
    input.source = context.createMediaStreamSource(stream);
    input.analyser = context.createAnalyser();
    input.analyser.fftSize = 1024;
    input.buffer = new Float32Array(input.analyser.fftSize);
    input.source.connect(input.analyser);
    input.mode = 'mic';
    get('tap').disabled = true;
    input.floor = .006;
    input.previous = 0;
    input.last = -Infinity;
    stream.getAudioTracks().forEach(track => track.addEventListener('ended',() => {
      if (stream !== input.stream) return;
      stopMic();
      get('inputStatus').textContent = '麦克风已断开，已切回键盘 / 触屏。';
    }));
    get('micMeter').hidden = false;
    get('sensitivityRow').hidden = false;
    get('mic').setAttribute('aria-pressed','true');
    get('keyboard').setAttribute('aria-pressed','false');
    get('inputStatus').textContent = '先试敲一下，观察音量条。游戏中请让当前组单独击打。';
    input.frame = requestAnimationFrame(listen);
  } catch {
    if (request !== input.request) return;
    stopMic();
    get('inputStatus').textContent = '麦克风未开启，可继续用键盘 / 触屏。';
  }
}
function listen(now) {
  input.analyser.getFloatTimeDomainData(input.buffer);
  const rms = Math.sqrt(input.buffer.reduce((sum,sample) => sum+sample*sample,0)/input.buffer.length);
  const sensitivity = Number(get('sensitivity').value)/100;
  const threshold = Math.max(.004 + .045*(1-sensitivity)**2, input.floor*(1.6+1.5*(1-sensitivity)));
  const meter = get('micFill');
  meter.style.width = Math.min(100,rms*560) + '%';
  if (now-input.last > 70 && rms > threshold && rms > input.previous*1.22) {
    input.last = now;
    if (phase === 'playing') strike(now);
    else get('inputStatus').textContent = '侦测到一次击打，可以开始挑战。';
  }
  if (now-input.last > 105) input.floor += (rms-input.floor)*.05;
  input.previous = rms;
  input.frame = requestAnimationFrame(listen);
}
levelButtons.forEach(button => button.addEventListener('click',() => showLevel(button.dataset.level)));
get('start').addEventListener('click',() => phase === 'playing' ? showLevel(level) : startRound());
get('demo').addEventListener('click',demonstrate);
instrumentButtons.forEach(button => button.addEventListener('click',() => selectInstrument(button)));
get('tap').addEventListener('pointerdown',event => {if(event.button===0 && input.mode!=='mic') strike();});
get('tap').addEventListener('click',event => {if (event.detail===0 && input.mode!=='mic') strike();});
get('keyboard').addEventListener('click',stopMic);
get('mic').addEventListener('click',enableMic);
get('tempo').addEventListener('change',() => showLevel(level));
get('fullscreen').addEventListener('click',async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    get('fullscreen').textContent = '请用浏览器全屏';
  }
});
document.addEventListener('fullscreenchange',() => {
  get('fullscreen').textContent = document.fullscreenElement ? '退出全屏' : '全屏投影';
});
window.addEventListener('keydown',event => {
  if (event.code!=='Space' || event.repeat || phase!=='playing' || event.target.matches('select,input')) return;
  event.preventDefault();
  if (input.mode!=='mic') strike();
});
window.addEventListener('pagehide',stopMic);
stopMic();
showLevel(level);
</script>
</body>
</html>
